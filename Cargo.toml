[package]
name = "xdrtool"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Herramienta CLI de tamper/bypass de Cortex XDR (pruebas autorizadas)"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
] }
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
